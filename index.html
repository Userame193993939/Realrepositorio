<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conoce el espacio personal de Renata Patricia y sus fotografías recientes.">
    <meta name="theme-color" content="#ff66a3">
    <title>Renata Patricia 💖</title>
    <style>
        :root {
            --primary-color: #ff66a3;
            --secondary-color: #ffe6f0;
            --text-main: #2c2c2c;
            --text-muted: #757575;
            --bg-color: #f7f9fc;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background: #fff;
            min-height: 100vh;
            box-shadow: 0 4px 12px rgba(0,0,0,.05);
            padding-bottom: 30px;
            animation: fadeIn 0.6s ease-out forwards;
        }
        .profile-header {
            text-align: center;
            padding: 30px 20px 20px;
        }
        .profile-pic {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary-color);
            padding: 3px;
            background: #fff;
            box-shadow: 0 4px 8px rgba(255,102,163,.2);
        }
        .profile-name {
            font-size: 22px;
            font-weight: 700;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .verification-badge {
            color: #1da1f2;
            font-size: 16px;
        }
        .profile-info {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 5px;
            font-weight: 500;
        }
        .profile-bio {
            font-size: 15px;
            margin-top: 15px;
            padding: 0 10px;
        }
        .action-buttons {
            padding: 0 25px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: transform .2s ease, box-shadow .2s ease;
        }
        .btn:active { transform: scale(.98); }
        .btn-whatsapp {
            background: #25D366;
            color: #fff;
            box-shadow: 0 4px 10px rgba(37,211,102,.3);
        }
        .btn-primary {
            background: var(--primary-color);
            color: #fff;
            box-shadow: 0 4px 10px rgba(255,102,163,.3);
        }
        .btn-secondary {
            background: var(--secondary-color);
            color: var(--primary-color);
            border: 1px solid rgba(255,102,163,.2);
        }
        .gallery-title {
            padding: 0 25px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--text-main);
        }
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 3px;
            padding: 0 3px;
        }
        .photo-link {
            display: block;
            position: relative;
            aspect-ratio: 4 / 5;
            overflow: hidden;
            background: #f1e5eb;
        }
        .photo-link img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .3s ease;
        }
        .photo-link:active img { transform: scale(1.05); }
        .photo-link:focus-visible, .btn:focus-visible {
            outline: 3px solid #333;
            outline-offset: 3px;
        }
        @media (min-width: 700px) {
            body { padding: 24px 0; }
            .mobile-container { border-radius: 18px; overflow: hidden; }
        }
    </style>
</head>
